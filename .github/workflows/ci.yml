name: CI

# Nothing gated this repository before: the suite, the analyser, the type
# checker and the asset build were all run by hand, so a broken public page
# shipped and 243 static-analysis errors accumulated unnoticed. Every gate below
# is one that passes on the current commit, so a failure means a real regression.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache

jobs:
  backend:
    name: PHP — tests, static analysis, style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json requires ^8.4; the development toolchain runs 8.6.
          php-version: "8.4"
          extensions: dom, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      # composer's post-autoload-dump runs artisan package:discover, which boots
      # the application, so the .env must exist before composer install - not
      # after it. key:generate still runs after (it needs the framework installed).
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan key:generate

      - name: Tests
        run: vendor/bin/phpunit

      # Report without blocking until baseline is clean; then remove continue-on-error.
      - name: Composer audit
        run: composer audit --locked
        continue-on-error: true

      # The suite is not the only gate: 121 of the errors PHPStan used to report
      # were real defects (missing columns, a relation that never existed, dead
      # branches). `composer run analyse` is the same command with the memory
      # limit PHPStan needs on this codebase.
      - name: Static analysis
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress

      - name: Code style
        run: vendor/bin/pint --test

  frontend:
    name: Frontend — lint, types, asset build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The pages had no test runner, so a defect like the reject button posting
      # `approved` could only be found by a human clicking it.
      - name: Component tests
        run: npm test

      - name: Build assets
        run: npm run build

      # Report without blocking until baseline is clean; then remove continue-on-error.
      - name: npm audit
        run: npm audit --omit=dev
        continue-on-error: true

  backend-mysql:
    name: PHP — tests against MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.json requires ^8.4; the development toolchain runs 8.6.
          php-version: "8.4"
          extensions: dom, mbstring, zip, pdo_mysql
          coverage: none

      # composer's post-autoload-dump runs artisan package:discover, which boots
      # the application, so the .env must exist before composer install - not
      # after it. key:generate still runs after (it needs the framework installed).
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan key:generate

      # phpunit.xml sets DB_CONNECTION=sqlite and DB_DATABASE=:memory: with
      # force=false (the default), so real environment variables take precedence.
      # We override them here to use the MySQL service.
      - name: Tests (MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/phpunit