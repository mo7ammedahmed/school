# =============================================================================
# Aether School OS - nginx front end
#
# Serves /var/www/html/public and hands PHP to the `app` container over
# FastCGI on port 9000. Mounted at /etc/nginx/conf.d/default.conf by
# docker-compose.yml, so it sits in the `http` context, not a `server` context.
# =============================================================================

server {
    listen      80;
    server_name _;

    # Root is `public`, never the project root. Exposing the project root would
    # serve composer.json, .env.example and the application source as
    # static files.
    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Upload limit
    # -------------------------------------------------------------------------
    # 64m, and this is the largest single request the application can make.
    #
    # app/Http/Controllers/Public/AdmissionsController.php:117-120 accepts four
    # uploads in ONE request, each up to max:10240 KB:
    #     birth_certificate, previous_school_records, passport_photos,
    #     medical_records
    # 4 x 10 MB = 40 MB of payload before multipart boundaries and form fields,
    # which rounds to roughly 41 MB. 64m leaves comfortable headroom for a
    # real upload without turning this into an open door.
    #
    # The other upload rules are all smaller and are covered by this:
    #   StoreDocumentRequest        max:10240  (10 MB, one file)
    #   UpdateDocumentRequest       max:10240
    #   StoreMaterialRequest        max:10240
    #   UpdateMaterialRequest       max:10240
    #   SubmissionController:42     max:10240
    #   AssessmentImportController  max:8192   (8 MB, extensions:docx)
    #   SchoolSettingsController    max:2048   (logo)
    #   AppearanceSettingsController max:2048  (logo) / max:512 (favicon)
    #
    # nginx rejects an oversized body with a 413 before PHP ever sees it, which
    # is why this cannot simply be left at the 1 MB default.
    #
    # This must stay in step with post_max_size in docker/php/99-app.ini (64M).
    # If PHP's limit is the lower of the two, nginx accepts the body, PHP
    # discards it, and the request fails as an empty POST with a confusing
    # "required field missing" validation error instead of a clean 413.
    client_max_body_size 64m;

    # Uploads are large and arrive over links that are sometimes slow; the
    # default 60s is fine for the body but the disk write must not be cut off
    # mid-stream.
    client_body_timeout 300s;

    # -------------------------------------------------------------------------
    # Routing
    # -------------------------------------------------------------------------
    # Laravel lives at /index.php and the Vite manifest is injected at runtime,
    # so no front controller rewrite is needed - only static files that do not
    # exist on disk. `try_files $uri =404` on the asset location below means a
    # stale /build URL is a real 404 rather than an HTML page served with a 200
    # and a MIME error in the console. error_page 404 /index.php further down
    # then renders that 404 through the application's own error handler.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Any Laravel exception should render through the application's error
    # handler, not nginx's default page.
    error_page 404 /index.php;

    # -------------------------------------------------------------------------
    # PHP
    # -------------------------------------------------------------------------
    # fastcgi_split_path_info is required here, not optional. Without it
    # $fastcgi_path_info is empty, so SCRIPT_FILENAME resolves to the wrong
    # path for PATH_INFO requests and PHP silently executes the wrong file or
    # fatals. It is placed before fastcgi_param PATH_INFO so both are set from
    # the split values.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $uri =404;

        fastcgi_index index.php;
        include fastcgi_params;

        # $document_root is /var/www/html/public and $fastcgi_script_name is the
        # matched path, so this resolves to /var/www/html/public/index.php.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_pass app:9000;

        # Invoice and timetable PDFs are rendered by dompdf synchronously inside
        # the request (barryvdh/laravel-dompdf on InvoicePdf and
        # resources/views/timetable/pdf.blade.php), and a 10 MB upload is
        # written to disk inside the request. 120s is above the 60s
        # max_execution_time in docker/php/99-app.ini so nginx is not the
        # component that gives up first.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;

        # Buffers the FastCGI stream to a temporary file instead of holding it in
        # nginx workers. Required for multi-megabyte responses, which is what
        # PDF downloads are.
        fastcgi_buffering on;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # -------------------------------------------------------------------------
    # Dotfiles
    # -------------------------------------------------------------------------
    # Denies .env, .git, .editorconfig and friends. The negative lookahead keeps
    # /.well-known reachable, which acme/Let's Encrypt needs on a public
    # deployment. Note this only protects what nginx can see: a bind-mounted
    # source tree would put .env.example in reach of `location /`, which is one
    # more reason the runtime image never contains it.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    # Vite already emits minified CSS and JS; gzip on top is still a 60-70%
    # saving on text payloads. compress_level 6 rather than the default 1 -
    # level 1 is chosen for speed on a per-request basis and is the wrong
    # default for assets that are cached by the browser for a year.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;
    # text/html is deliberately absent from this list. nginx compresses text/html
    # unconditionally whenever gzip is on, so listing it here only earns a
    # "duplicate MIME type text/html" warning at startup.

    # Static assets. Fingerprinted by Vite, so the long max-age is safe: Vite
    # hashes the contents into the filename, which means a changed file is a
    # changed URL and can never be a stale cache hit.
    #
    # `expires` emits Cache-Control: max-age=31536000 and add_header adds a
    # second Cache-Control: public, immutable alongside it. Two Cache-Control
    # headers combine per RFC 9111, and this is the standard way to get
    # `immutable` onto a fingerprinted asset. Note this regex location also
    # serves /storage/... directly from disk via the public/storage symlink,
    # which is the point: uploaded documents never reach php-fpm.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
