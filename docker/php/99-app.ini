; Aether School OS - PHP-FPM runtime settings.
;
; Loaded from /usr/local/etc/php/conf.d/, so it applies to both the web SAPI
; (nginx -> php-fpm) and the CLI SAPI used by the queue worker, the scheduler
; and `php artisan`.
;
; Sizes are sized against what the application actually accepts. The binding
; constraint is app/Http/Controllers/Public/AdmissionsController.php:117-120,
; which takes four uploads of up to 10 MB in a single request:
; birth_certificate, previous_school_records, passport_photos,
; medical_records. 4 x 10 MB plus multipart overhead is a ~41 MB body, so
; post_max_size is 64M and nginx's client_max_body_size matches at 64m.
; upload_max_filesize is per-file and must clear the largest single-file rule
; (max:10240 = 10 MB in StoreDocumentRequest, StoreMaterialRequest,
; SubmissionController and the admission documents); 12M leaves headroom
; without letting an oversized upload reach disk.

memory_limit = 512M
max_execution_time = 60

upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 20
max_input_vars = 5000

; dompdf renders InvoicePdf and the timetable PDF synchronously inside the
; request, and uploads are streamed to storage. Both want more than the 128M
; default before the limiter starts killing workers.

; barryvdh/laravel-dompdf registers its own error handlers and reads templates;
; leaving opcache.save_comments on keeps those docblocks available to it.
; Also leave display_errors off: APP_DEBUG controls that, and a fatal in the
; PDF path must not be echoed into the response body.
display_errors = Off

date.timezone = UTC

; Production opcache. validate_timestamps=0 is the reason a rebuilt image is
; required for PHP changes to take effect - a file edited inside a bind-mounted
; source tree will NOT be picked up until the container restarts. That is the
; correct trade for the deployed image and the wrong one for the dev loop; the
; compose file says so next to the bind mount.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Laravel resolves a lot of paths per request (storage_path(), public_path(),
; the provider manifest). A warm path cache is a cheap win and, unlike the
; settings above, is safe to keep in development too.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
