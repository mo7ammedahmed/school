# =============================================================================
# MediaMTX — the live lesson server
#
# One process serves both directions of a lesson: teachers publish over WHIP,
# students watch over WHEP, and every published stream is recorded to the
# shared volume the app reads. No per-minute service, no vendor.
#
# The app never talks to this server except through the browser and the
# `notReady` hook below. See config/media.php for the app side.
# =============================================================================

logLevel: info
logDestinations: [stdout]

# Two HTTP ports, both plain here and both behind TLS in production (nginx, or
# a load balancer): WHIP and WHEP on 8889, HLS on 8888. They are separate
# because they answer different questions — WHEP is the sub-second path the
# student player tries first, HLS is the one that survives a network which
# blocks WebRTC's UDP port (`MEDIA_HLS_URL` on the app side).
rtsp: no
rtmp: no
srt: no
api: yes
apiAddress: :9997
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
# fMP4 playlists with partial segments, which is what `lowLatencyMode` in
# hls.js consumes. It also carries AV1/VP9/Opus, the codecs a browser publish
# ends up with here — the mpegts variant does not.
hlsVariant: lowLatency
# The player runs on the app's origin (a different port locally, a different
# host behind a reverse proxy), so the browser will not read the playlist
# without this header — and the fallback would fail in exactly the place it
# exists to cover. Read-only endpoint; it exposes streams that are already
# being broadcast to whoever holds the session's stream key.
#
# The plural name, not `hlsAllowOrigin`: 1.21 warns on every start that the
# singular form is deprecated, and a config that warns is a config nobody reads.
hlsAllowOrigins: ['*']
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes

# A teacher publishing from a browser may be behind NAT; a hostname is better
# than an IP for the ICE candidate. Set MEDIA_MTX_WEBRTC_HOST in production.
webrtcAdditionalHosts: []

# -----------------------------------------------------------------------------
# Recordings
# -----------------------------------------------------------------------------
# One fMP4 file per stream, written under /recordings/<path>. The app's
# finalize job reads this directory, remuxes to faststart MP4 and copies the
# lesson onto the private disk. Nothing serves these files directly.
#
# These live under `pathDefaults` because MediaMTX 1.21 moved them there; the
# old top-level keys still load but warn on every start.
#
# fMP4 cannot carry VP8 (nor can MPEG-TS). A browser that publishes VP8 is
# logged as `no supported tracks found` and nothing is written — which is why
# the studio asks for a recordable codec before it offers the stream
# (resources/js/lib/media/whip.ts).
# -----------------------------------------------------------------------------
pathDefaults:
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s

# -----------------------------------------------------------------------------
# Auth
# -----------------------------------------------------------------------------
# The application validates action-bound encrypted credentials and current
# membership/enrollment. Knowing a stream path never grants publish or read.
# For a non-Compose server, override MTX_AUTHHTTPADDRESS with its app URL.
authMethod: http
authHTTPAddress: http://nginx/media/authorize
authHTTPExclude: []

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
# One wildcard path for every session. The path name is the session's random
# `stream_key`, which the app renders only to the owning teacher and to
# enrolled students.
#
# No `runOnNotReady` hook here on purpose. The official MediaMTX image ships no
# HTTP client, so a hook would have to shell out to a binary that is not in the
# image. The app asks this server's API instead (MEDIA_API_URL +
# `live-sessions:finalize` every five minutes), which needs nothing installed
# here and keeps the reconciliation in one place. The app-side hook endpoint
# stays available for deployments that add curl to this image.
paths:
  all_others:
    record: yes
